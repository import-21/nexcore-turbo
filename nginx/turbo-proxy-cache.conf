# nexcore-turbo: page cache for apps behind proxy_pass (Django, Flask, ...).
# Include inside the location that proxies to the app; needs turbo-http.conf
# in http{}. Same rules as turbo-php-cache.conf: logged-in visitors, sessions,
# admin/API paths, query strings and non-GET requests are never cached, and
# responses that set a cookie or say private/no-store are never stored.
#
#   location / {
#       proxy_pass http://app;
#       include /etc/nginx/turbo/turbo-proxy-cache.conf;
#   }
#
# Add  add_header X-Turbo-Cache $upstream_cache_status always;  at server level
# to see HIT / MISS / BYPASS per response.

proxy_cache turbo_proxy;
proxy_cache_key "$scheme$turbo_forwarded_proto$request_method$host$turbo_uri";   # $turbo_uri: see turbo-http.conf;
# the forwarded scheme too: a client-sent X-Forwarded-Proto changes the links the app writes
proxy_cache_valid 200 60s;          # long is fine: refresh-on-update replaces a page when it changes
proxy_cache_valid 301 302 60s;
proxy_cache_valid 404 10s;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
# The app is down, crashing or too slow: keep showing the last good copy (kept up to 24 h, see inactive=).
proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_bypass $turbo_skip $turbo_refresh;
proxy_no_cache $turbo_skip;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Turbo-Compress $turbo_compress;   # 1 = cacheable; always sent so a client value never passes
gunzip on;                                            # cached gzip, client without gzip
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $turbo_forwarded_proto;
