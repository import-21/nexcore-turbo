# nexcore-turbo: http{} context. Include once per nginx instance.
#
#   http {
#       include /etc/nginx/turbo/turbo-http.conf;
#       ...
#   }
#
# Defines the page cache zone and the rules that decide which requests must
# never be served from (or stored in) the cache.

fastcgi_cache_path /var/cache/nginx/turbo levels=1:2 keys_zone=turbo:32m
                   max_size=512m inactive=10m use_temp_path=off;
# Same, for apps behind proxy_pass (Django, Flask, ...): turbo-proxy-cache.conf.
proxy_cache_path /var/cache/nginx/turbo-proxy levels=1:2 keys_zone=turbo_proxy:32m
                 max_size=512m inactive=10m use_temp_path=off;

# Only GET/HEAD are cacheable.
map $request_method $turbo_skip_method {
    default 1;
    GET     0;
    HEAD    0;
}

# Visitors who are logged in, have commented, protected-post viewers, shoppers
# with a cart, or anyone holding a PHP / Django / Flask session (or a pending
# Django message) see personalised pages.
map $http_cookie $turbo_skip_cookie {
    default 0;
    "~*wordpress_logged_in_|wp-postpass_|comment_author_|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_|edd_items_in_cart|PHPSESSID" 1;
    "~*(^|;\s*)(sessionid|session|messages)=" 1;
}

# Admin, login, API, cron, feeds and shop flows are always dynamic.
# Matched against the original request ($request_uri): $uri has already been
# rewritten to /index.php by try_files when the PHP location runs.
map $request_uri $turbo_skip_uri {
    default 0;
    "~*^/(wp-admin|wp-login\.php|wp-json|xmlrpc\.php|wp-cron\.php|wp-comments-post\.php|index\.php/wp-json)" 1;
    "~*/(cart|checkout|my-account|basket|feed)(/|\?|$)" 1;
    "~*sitemap[^/]*\.xml" 1;
    "~*^/(admin|accounts|api)(/|\?|$)" 1;
}

# Query strings (search, previews, tracking params) bypass the cache so they
# cannot be used to fill it with junk keys.
map $args $turbo_skip_args {
    default 1;
    ""      0;
}

map $http_authorization $turbo_skip_auth {
    default 1;
    ""      0;
}

map "$turbo_skip_method$turbo_skip_cookie$turbo_skip_uri$turbo_skip_args$turbo_skip_auth" $turbo_skip {
    default 1;
    "00000" 0;
}

# Refresh on update: a GET carrying "X-Turbo-Refresh: <secret>" skips the
# cached copy, renders the page and stores the new version, so a long cache
# lifetime is fine. The secret is known only to the application (see
# wordpress/nexcore-turbo-refresh.php and python/nexcore_turbo/refresh.py) and
# is checked together with the Host, one line per secret in turbo/refresh/*.map:
#     "~\|<secret>$" 1;                 any host (single site)
#     "~^<site>\.[^|]*\|<secret>$" 1;    only <site>.<domain> (multi-site)
# so one site's secret can never refresh another site's pages.
# Regex entries on purpose: exact-match keys this long overflow nginx's default
# map hash bucket on CPUs with 32-byte cache lines. Ordinary requests have no
# header, get an empty key and stop at the "" entry: the regexes cost them nothing.
map $http_x_turbo_refresh $turbo_refresh_key {
    ""      "";
    default "$host|$http_x_turbo_refresh";
}
map $turbo_refresh_key $turbo_refresh {
    default 0;
    ""      0;
    include /etc/nginx/turbo/refresh/*.map;
}
