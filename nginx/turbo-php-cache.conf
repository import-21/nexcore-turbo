# nexcore-turbo: include inside the location that passes requests to PHP-FPM.
#
#   location ~ \.php$ {
#       ...
#       fastcgi_pass php:9000;
#       include /etc/nginx/turbo/turbo-php-cache.conf;
#   }
#
# Responses that set a cookie, or that the application marks private /
# no-store / no-cache, are never stored (nginx default; we keep honouring them).
#
# To see HIT/MISS/BYPASS, add this at server{} level (not inside the location,
# where it would replace the server's own add_header lines):
#   add_header X-Turbo-Cache $upstream_cache_status always;

fastcgi_cache turbo;
fastcgi_cache_key "$scheme$request_method$host$request_uri";
fastcgi_cache_valid 200 301 302 60s;
fastcgi_cache_valid 404 10s;
fastcgi_cache_lock on;
fastcgi_cache_lock_timeout 5s;
fastcgi_cache_use_stale updating error timeout http_500 http_503;
fastcgi_cache_background_update on;
fastcgi_cache_bypass $turbo_skip $turbo_refresh;
fastcgi_no_cache $turbo_skip;
