# nexcore-turbo: server{} context for a WordPress (or any front-controller PHP) site.
#
#   server {
#       listen 80;
#       server_name example.com;
#       root /var/www/html;
#       set $turbo_php_upstream turbo_php;  # an upstream{} name, or unix:/run/php/php8.3-fpm.sock
#       include /etc/nginx/turbo/turbo-wordpress.conf;
#   }
#
#   upstream turbo_php { server php:9000; }   # in http{}, when FPM listens on TCP

index index.php index.html;
client_max_body_size 64m;
add_header X-Turbo-Cache $upstream_cache_status always;
add_header Vary Accept-Encoding always;   # pages may be sent gzipped; PHP does not say so (one cached copy)

location = /favicon.ico { log_not_found off; access_log off; }
location = /robots.txt  { try_files $uri /index.php?$args; log_not_found off; access_log off; }

# Never execute PHP that was uploaded, and never serve dotfiles (.env, .git ...).
location ~* ^/wp-content/uploads/.*\.(php|phar|phtml)$ { deny all; }
location ~ /\.(?!well-known/) { deny all; }

location ~* \.(?:css|js|mjs|map|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm)$ {
    try_files $uri =404;
    expires 30d;
    access_log off;
}

location / {
    try_files $uri $uri/ /index.php?$args;
}

location ~ \.php$ {
    try_files $fastcgi_script_name =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass $turbo_php_upstream;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    include /etc/nginx/turbo/turbo-php-cache.conf;
}
