; nexcore-turbo: OPcache for PHP 7.4 - 8.4.
; Drop into PHP's conf.d (e.g. /usr/local/etc/php/conf.d/ or /etc/php/8.3/fpm/conf.d/).
;
; Files are re-checked at most every 2 seconds, so plugin/theme updates and
; edits made through a file manager still take effect without a restart.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1

realpath_cache_size=4096K
realpath_cache_ttl=600
