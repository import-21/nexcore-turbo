; nexcore-turbo: PHP-FPM pool overrides. Load after the distribution's www.conf
; (e.g. /usr/local/etc/php-fpm.d/zz-turbo.conf or /etc/php/8.3/fpm/pool.d/zz-turbo.conf).
;
; With the nginx page cache in front, PHP only runs for cache misses and
; logged-in users, so a few workers are enough. "dynamic" keeps idle memory low.

[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
