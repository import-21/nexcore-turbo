{% extends "blog/base.html" %}
{% block main %}{% if q %}<h1>「{{ q }}」の検索結果</h1>{% endif %}
{% for p in posts %}<article><h2><a href="{{ p.get_absolute_url }}">{{ p.title }}</a></h2>
<time>{{ p.published|date:"Y-m-d" }}</time><p>{{ p.body|truncatechars:160 }}</p></article>
{% empty %}<p>記事はありません。</p>{% endfor %}{% endblock %}
