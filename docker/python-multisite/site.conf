# One server block for every site: <site>.<any domain> is proxied to the
# site's socket /run/turbo/<site>.sock (started on demand by the app service).
map $host $turbo_site {
    default "";
    "~^(?<s>[a-z0-9][a-z0-9-]{0,40})\." $s;
}

server {
    listen 80 default_server reuseport;
    server_name _;
    add_header X-Turbo-Cache $upstream_cache_status always;

    # Sites come and go at runtime: never remember a missing directory.
    open_file_cache_errors off;
    open_file_cache_valid 10s;

    if ($turbo_site = "") { return 404; }
    if (!-d /srv/sites/$turbo_site/static) { return 404; }   # the site dir itself is 0711

    # collectstatic output: /srv/sites/<site>/static/
    location /static/ {
        root /srv/sites/$turbo_site;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/turbo/$turbo_site.sock:;
        include /etc/nginx/turbo/turbo-proxy-cache.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
