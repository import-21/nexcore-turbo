# One server block for every site: <site>.<any domain> is served from
# /srv/sites/<site> through its own PHP-FPM pool socket.
map $host $turbo_site {
    default "";
    "~^(?<s>[a-z0-9][a-z0-9-]{0,40})\." $s;
}

server {
    listen 80 default_server reuseport;
    server_name _;
    root /srv/sites/$turbo_site;

    # Sites come and go at runtime: never remember a missing directory, and
    # re-check existing ones every 10 s (nginx.conf caches for 60 s).
    open_file_cache_errors off;
    open_file_cache_valid 10s;

    if ($turbo_site = "") { return 404; }
    if (!-d /srv/sites/$turbo_site) { return 404; }

    set $turbo_php_upstream unix:/run/php/$turbo_site.sock;
    include /etc/nginx/turbo/turbo-wordpress.conf;
}
