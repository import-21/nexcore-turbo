; Many sites share one OPcache. WordPress core files are identical across sites
; but live at different paths, so each site adds its own entries: give room.
opcache.memory_consumption=256
opcache.max_accelerated_files=100000

; Compress cacheable pages once in PHP (php/turbo-compress.php). It lives in the shared, root-owned
; core so every site's open_basedir (/srv/sites/<name>:/srv/core:/tmp) can read it and none can change it.
auto_prepend_file = /srv/core/turbo-compress.php
