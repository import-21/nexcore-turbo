; FPM needs at least one pool to start; this one never spawns a worker unless asked.
[_health]
user = www-data
group = www-data
listen = /run/php/_health.sock
listen.group = 101
listen.mode = 0660   ; nginx only: a site must not hand this pool scripts to run as www-data
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 5s
ping.path = /ping
