; Shared by every site pool. One FPM master = one OPcache shared by all sites.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no
; Upper limit of PHP workers across ALL site pools together, so a burst on
; many sites at once queues instead of exhausting memory. With the shared core
; a worker costs only a few MB of its own; keep this above the number of sites
; that run PHP at the same moment, or their requests wait for a free slot.
process.max = 400
; Restart FPM if many children crash in a short time.
emergency_restart_threshold = 10
emergency_restart_interval = 1m
