# nexcore-turbo: WordPress behind an nginx page cache.
#   cp .env.example .env && docker compose up -d
name: ${COMPOSE_PROJECT_NAME:-turbo-wp}

services:
  nginx:
    image: nginx:${NGINX_VERSION:-1.26-alpine}
    depends_on: [wordpress]
    ports: ["${HTTP_PORT:-8080}:80"]
    environment:
      TURBO_CACHE_TTL: ${TURBO_CACHE_TTL:-24h}       # pages are replaced on update (refresh), so they can live long
      TURBO_STRIP_TRACKING: ${TURBO_STRIP_TRACKING:-1}
      TURBO_CACHE_SIZE: ${TURBO_CACHE_SIZE:-600m}     # cache tmpfs below; nginx keeps its limit 15% under it
      TURBO_RATE_DYNAMIC: ${TURBO_RATE_DYNAMIC:-}     # cache misses per second per site (default 50)   # 0: utm_* / fbclid reach the app again (and bypass the cache)
      TURBO_NGINX_WORKERS: ${TURBO_NGINX_WORKERS:-}
      TURBO_REFRESH_SECRET: ${TURBO_REFRESH_SECRET:?set TURBO_REFRESH_SECRET in .env (16-40 random letters/digits)}
    volumes:
      - ../../nginx/nginx.conf:/opt/turbo/nginx.conf:ro
      - ../../nginx/turbo-http.conf:/opt/turbo/turbo-http.conf:ro
      - ../../nginx/turbo-php-cache.conf:/opt/turbo/turbo-php-cache.conf:ro
      - ../../nginx/turbo-wordpress.conf:/opt/turbo/turbo-wordpress.conf:ro
      - ./40-turbo-tune.sh:/docker-entrypoint.d/40-turbo-tune.sh:ro
      - ./site.conf:/etc/nginx/conf.d/default.conf:ro
      - wp-files:/var/www/html:ro
    tmpfs:
      - /var/cache/nginx/turbo:size=${TURBO_CACHE_SIZE:-600m}
    restart: unless-stopped

  wordpress:
    image: wordpress:${WORDPRESS_TAG:-php8.3-fpm-alpine}
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TURBO_REFRESH_SECRET: ${TURBO_REFRESH_SECRET:?set TURBO_REFRESH_SECRET in .env (16-40 random letters/digits)}
      TURBO_REFRESH_URL: http://nginx
    volumes:
      - wp-files:/var/www/html
      - ../../wordpress/nexcore-turbo-refresh.php:/var/www/html/wp-content/mu-plugins/nexcore-turbo-refresh.php:ro
      - ../../php/turbo-opcache.ini:/usr/local/etc/php/conf.d/zz-turbo-opcache.ini:ro
      - ../../php/turbo-compress.ini:/usr/local/etc/php/conf.d/zz-turbo-compress.ini:ro
      - ../../php/turbo-compress.php:/usr/local/etc/php/turbo-compress.php:ro
      - ../../php/turbo-fpm.conf:/usr/local/etc/php-fpm.d/zz-turbo.conf:ro
    restart: unless-stopped

  db:
    image: ${DB_IMAGE:-mariadb:11.4}
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  wp-files:
  db-data:
